<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Init Intra</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a56db'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='800' font-size='20'%3EI%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Portal intranet Init Intra – acesso restrito." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a56db" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>
<body>
  <a href="#contentArea" class="skip-link" onclick="document.getElementById('contentArea').focus();">Pular para o conteúdo</a>
  <!-- Offline/Online Banner (Sprint 9) -->
  <div id="offlineBanner" class="offline-banner">
    <div class="offline-indicator" id="offlineIndicatorDot"></div>
    <span id="offlineBannerMsg">Sem conexão – modo offline ativo</span>
    <button id="syncNowBtn" onclick="syncNow()" style="display:none" aria-label="Sincronizar dados com nuvem">↻ Sincronizar</button>
  </div>

  <!-- Busca Global Modal (Sprint 7) -->
  <div id="globalSearchModal" class="global-search-modal" style="display:none" onclick="closeGlobalSearch(event)">
    <div class="global-search-box">
      <div class="global-search-input-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="globalSearchInput" type="text" placeholder="Buscar clientes, pendências…" autocomplete="off" />
        <span class="esc-key" onclick="closeGlobalSearch()">ESC</span>
      </div>
      <div class="search-results-container" id="searchResultsContainer">
        <div class="search-empty">Digite para pesquisar…</div>
      </div>
      <div class="search-footer">
        <span><kbd>↑↓</kbd> navegar</span>
        <span><kbd>↵</kbd> selecionar</span>
        <span><kbd>ESC</kbd> fechar</span>
      </div>
    </div>
  </div>

  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="logo-initnet.svg" alt="InitNET" class="logo-img" />
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Recolher menu" aria-label="Recolher menu lateral">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>

      <div id="teamSelectorWrap" style="display:none;padding:8px 12px;border-bottom:1px solid var(--sidebar-border)">
        <select id="teamSelector" class="form-select" style="width:100%;font-size:12px" onchange="onTeamChange(this.value)">
          <option value="">Todas as equipes</option>
        </select>
      </div>
      <nav class="sidebar-nav" role="navigation" aria-label="Menu principal">
        <a class="nav-item active" id="nav-dashboard" onclick="navigateTo('dashboard')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('dashboard')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" id="nav-pendencias" onclick="navigateTo('pendencias')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('pendencias')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Pendências</span>
          <span class="badge hidden" id="badge-pendencias">0</span>
        </a>
        <a class="nav-item" id="nav-calendario" onclick="navigateTo('calendario')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('calendario')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Calendário</span>
        </a>
        <a class="nav-item" id="nav-visitas" onclick="navigateTo('visitas')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('visitas')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h12"/><circle cx="7" cy="18" r="2"/><path d="M17 18l2 2 4-4"/></svg>
          <span>Visitas</span>
          <span class="badge hidden" id="badge-visitas">0</span>
        </a>
        <a class="nav-item" id="nav-clientes" onclick="navigateTo('clientes')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('clientes')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Clientes</span>
        </a>
        <a class="nav-item" id="nav-templates" onclick="navigateTo('templates')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('templates')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Modelos</span>
        </a>
        <a class="nav-item" id="nav-operadores" onclick="navigateTo('operadores')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('operadores')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Operadores</span>
        </a>
        <a class="nav-item" id="nav-historico" onclick="navigateTo('historico')" tabindex="0" role="link" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('historico')}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Histórico</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-export" onclick="exportData()" title="Exportar backup dos dados" aria-label="Exportar backup dos dados">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Exportar dados</span>
        </button>
        <button class="btn-export" onclick="importData()" title="Importar backup" aria-label="Importar backup de dados">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Importar dados</span>
        </button>
        <div class="current-user" id="userQuickBtn">
          <div class="avatar" id="user-avatar" style="background:#1a56db">TI</div>
          <div class="user-info">
            <span class="user-name" id="user-name-display">Suporte TI</span>
            <span class="user-role" id="user-role-display">Técnico</span>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn" onclick="doLogout()" title="Sair" aria-label="Sair do sistema">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="mobileMenuBtn" aria-label="Abrir Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right" style="display:flex;align-items:center;gap:12px">
          <!-- Busca Global -->
          <div class="global-search-wrap" id="globalSearchWrap">
            <button class="global-search-trigger" id="globalSearchTrigger" onclick="openGlobalSearch()" title="Buscar (Ctrl+K)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Buscar…
              <span class="kbd">Ctrl+K</span>
            </button>
          </div>
          <!-- Status de conexão -->
          <div class="conn-status-dot" id="connStatusDot" title="Online"></div>
          <button class="theme-toggle-btn" id="notifSettingsBtn" title="Configurar notificações" onclick="openNotifSettings()" aria-label="Configurar notificações">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <button class="theme-toggle-btn" title="Recarregar página" onclick="refreshPage()" aria-label="Recarregar página atual">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <button class="theme-toggle-btn" id="themeToggleBtn" title="Alternar tema" aria-label="Alternar tema claro/escuro">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-moon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="btn btn-primary btn-sm" id="topbarActionBtn" style="display:none" onclick="topbarAction()" aria-label="Criar novo registro">
            <svg class="topbar-action-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="topbar-action-text">+ Novo</span>
          </button>
        </div>
      </header>
      <div class="content-area" id="contentArea" tabindex="-1"></div>
    </main>
  </div>

  <!-- Overlay para menu mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" style="display:none"></div>

  <!-- Modal principal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Fechar modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Modal usuário -->
  <div class="modal-overlay" id="userModalOverlay" style="display:none">
    <div class="modal sm">
      <div class="modal-header">
        <h2 class="modal-title">Meu Perfil</h2>
        <button class="modal-close" onclick="document.getElementById('userModalOverlay').style.display='none'" aria-label="Fechar configurações">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Seu nome</label><input type="text" class="form-input" id="userNameInput" placeholder="Ex: João Silva" /></div>
        <div class="form-group"><label class="form-label">Iniciais (avatar)</label><input type="text" class="form-input" id="userInitialsInput" maxlength="2" placeholder="Ex: JS" /></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveUserConfig()" aria-label="Salvar configurações">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal de recorte de imagem -->
  <div class="modal-overlay" id="cropModalOverlay" style="display:none">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h2 class="modal-title">Recortar Logo</h2>
        <button class="modal-close" onclick="closeCropModal()" aria-label="Fechar recorte de imagem">&times;</button>
      </div>
      <div class="modal-body" style="padding:16px">
        <div class="crop-container" id="cropContainer">
          <img id="cropImage" src="" alt="Recortar" />
        </div>
        <div class="crop-actions">
          <div class="crop-tools">
            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperRotate(-90)" title="Girar esquerda" aria-label="Girar imagem para esquerda">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperRotate(90)" title="Girar direita" aria-label="Girar imagem para direita">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperZoom(0.1)" title="Zoom +" aria-label="Aumentar zoom">+</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperZoom(-0.1)" title="Zoom −" aria-label="Diminuir zoom">−</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperReset()" title="Resetar" aria-label="Resetar recorte">↺ Reset</button>
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-secondary" onclick="closeCropModal()" aria-label="Cancelar recorte">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="applyCrop()" aria-label="Aplicar recorte"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M6 21V9m0 0h12M18 3v12m0 0H6"/></svg> Aplicar Recorte</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Configurações de Notificação -->
  <div class="modal-overlay" id="notifModalOverlay" style="display:none">
    <div class="modal sm">
      <div class="modal-header">
        <h2 class="modal-title">Configurar Notificações por E-mail</h2>
        <button class="modal-close" onclick="document.getElementById('notifModalOverlay').style.display='none'" aria-label="Fechar notificações">&times;</button>
      </div>
      <div class="modal-body" id="notifModalBody"></div>
    </div>
  </div>

  <!-- Overlay de Login -->
  <div id="loginOverlay" style="display:none;position:fixed;inset:0;z-index:500;background:linear-gradient(135deg,#0f172a 0%,#1e2a3a 50%,#1a2332 100%);overflow-y:auto">
    <div id="loginContent" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/pendencias.js"></script>
  <script src="js/operadores.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/visitas.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
