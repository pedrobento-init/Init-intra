name: Título do PR

# No merge por squash o título do PR vira a mensagem do commit, e é dela que o
# release-please tira a versão e o CHANGELOG. Título fora do padrão não entra.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  titulo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confere tipo(escopo) - resumo
        env:
          # Via env, não interpolado no script: o título é texto de terceiros.
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITULO" | grep -Eq '^(feat|fix|refactor|perf|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "Título ok: $TITULO"
          else
            echo "::error::Título fora do padrão: $TITULO"
            echo "Use tipo(escopo): resumo no imperativo. Ex.: fix(chamado): corrige o status ao encerrar"
            echo "Tipos: feat fix refactor perf docs style test build ci chore revert"
            exit 1
          fi
